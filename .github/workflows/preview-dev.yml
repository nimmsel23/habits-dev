# Preview-Deploy für Habits: dev-Push → 24h-Channel "dev", PR → eigener PR-Channel.
#
# Warum vitalos-Checkout: Die Vite-Configs aliassen Nachbar-Repos
# (Cross-Repo-Imports) — ein nackter Checkout dieses Repos kann nie bauen.
# Das Meta-Repo vitalos liefert per Submodules alle Nachbarn, danach wird
# DIESES Submodule auf den gerade gepushten Commit gesetzt und nur dieser
# Workspace gebaut.

name: Preview (Habits dev)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'journal'
      - '.gitmodules'
      - 'vite.config.cjs'
      - 'tailwind.config.cjs'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [vitalos, master, dev]
    paths:
      - 'src/**'
      - 'journal'
      - '.gitmodules'
      - 'vite.config.cjs'
      - 'tailwind.config.cjs'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout vitalos (Meta-Repo, liefert Nachbar-Repos)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/vitalos
          ref: master

      - name: Private Skills submodule access
        uses: ./.github/actions/skills-submodule-auth
        with:
          deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      - name: habits-dev auf den ausgelösten Commit setzen
        run: |
          cd habit-app
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch origin "$SHA"
          git checkout "$SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (Workspaces)
        run: pnpm install --frozen-lockfile
      # fitness-app erzeugt die KB-Daten (push/pull/legs.generated.js) sonst nur im eigenen prebuild
      - name: Generate fitness KB data (transitive dependency via @fitness-db)
        run: pnpm --filter ./fitness-app run build:kb-data

      - name: Install pinned Journal dependencies
        run: pnpm --dir habit-app/journal install --frozen-lockfile --ignore-scripts

      - name: Firebase config bereitstellen (habit-app/firebase.config.js ist gitignored)
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "$FIREBASE_CONFIG" > habit-app/firebase.config.js
          elif [ ! -f habit-app/firebase.config.js ]; then
            cp firebase.config.js habit-app/firebase.config.js
          fi
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}

      - name: Build Habits
        run: pnpm --filter ./habit-app run build:firebase

      - name: Verify complete Journal build and offline cache
        run: node habit-app/scripts/check-journal-build.mjs habit-app/dist-firebase

      - name: Deploy Preview Channel
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          entryPoint: habit-app
          channelId: ${{ github.event_name != 'pull_request' && 'dev' || '' }}
          expires: 24h

      - name: Telegram-Link senden
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Preview für Habits (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'dev' }}) gebaut!

            🔗 ${{ steps.firebase_deploy.outputs.details_url }}
            ⏱️ Gültig 24h.

            Commit: ${{ github.event.pull_request.title || github.event.head_commit.message }}
