# FROZEN (Owner 2026-11-07): keine Feature-Arbeit hier.
#   habits → journal-dev (apps/habits)
#   learn  → fitness-dev
# Check läuft wieder bei Push auf dev und bei PRs. Ohne diesen Push-Check
# fast-forwardet Auto-Promote nicht (Branch-Schutz verlangt den Check des Push).
# Check für Habits: Build auf jedem PR/dev-Push, ohne Deploy und ohne Firebase-Secrets.
#
# Gleicher Aufbau wie preview-dev.yml (Meta-Repo vitalos liefert die Nachbar-Repos, dieses
# Submodul wird auf den geprüften Commit gesetzt), aber ohne Pfadfilter und ohne Preview
# (Muster aus fitness-dev/check.yml).

name: Check (Habits)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optionaler Grund'
        required: false
        default: 'manual'
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout vitalos (Meta-Repo, liefert Nachbar-Repos)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/vitalos
          ref: master

      - name: Private Skills submodule access
        uses: ./.github/actions/skills-submodule-auth
        with:
          deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          # Nicht --recursive über das ganze Meta-Repo: journal-app zieht private
          # aos-* Repos, die dieser Check nicht braucht und die der Token nicht sieht.
          git submodule update --init
          git submodule update --init --recursive habit-app plan-app

      - name: habits-dev auf den geprüften Commit setzen
        run: |
          cd habit-app
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch origin "$SHA"
          git checkout "$SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (Workspaces)
        run: pnpm install --no-frozen-lockfile

      - name: Install pinned Journal dependencies
        run: pnpm --dir habit-app/journal install --frozen-lockfile --ignore-scripts

      - name: Smoke test
        run: pnpm --filter ./habit-app test

      - name: Tooling (Biome format scripts/)
        run: pnpm --filter ./habit-app run tooling:biome

      - name: Tooling (knip report)
        continue-on-error: true
        run: pnpm --filter ./habit-app run tooling:knip

      - name: Firebase config bereitstellen (gitignored, Platzhalter genügt zum Bauen)
        run: |
          if [ ! -f habit-app/firebase.config.js ]; then
            cp firebase.config.js habit-app/firebase.config.js
          fi

      - name: Checkout fitness KB (SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness
          ref: main
          path: fitness-kb
          submodules: recursive

      - name: KB in fitness-app einhängen
        run: |
          set -euo pipefail
          mkdir -p fitness-app/fitness/catalog
          rm -rf fitness-app/fitness/catalog/kb
          ln -sfn "$GITHUB_WORKSPACE/fitness-kb" fitness-app/fitness/catalog/kb
          test -d fitness-app/fitness/catalog/kb/exercises/6pack
          test -f fitness-app/fitness/catalog/kb/vendor/free-exercise-db/dist/exercises.json

      - name: Fitness generated.js (exercise-data, ohne plan/6pack)
        working-directory: fitness-app
        run: pnpm run build:exercise-data && pnpm run build:coaching-notes

      - name: Checkout backend (fuel shared SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/backend
          ref: dev
          path: backend
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Verify backend fuel shared
        run: test -f backend/fuel/src/shared/config/dach.mjs

      - name: Build Habits
        run: pnpm --filter ./habit-app run build:firebase

      - name: Verify complete Journal build and offline cache
        run: node habit-app/scripts/check-journal-build.mjs habit-app/dist-firebase
