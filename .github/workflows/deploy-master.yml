# Standalone-Prod Habits: Push auf master deployt live (nur CI).
# Echte Nachbarn: fitness-dev (@fitness-db/hooks) + fuel-dev (@fuel history) + journal-Submodul.
# Kein relax/6pack/plan/skills. KB-Daten (gitignored generated.js) via build:kb-data nötig,
# weil habits `export * from @fitness-db/index.firestore.js` zieht (inkl. kb.js).
#
# Auslöser: push auf master und workflow_dispatch (automerge.yml) -> baut und deployt live (nur master).
# Push auf `ci-test/**` -> reiner Build-Test (Nachbarn von dev), KEIN Deploy.

name: Live Deploy (Habits master)

'on':
  workflow_dispatch:
    inputs:
      deploy:
        description: "Live deployen? (nur auf master wirksam; false = nur bauen)"
        type: boolean
        default: true
  push:
    branches:
      - master
      - 'ci-test/**'

concurrency:
  group: live-habits-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEIGHBOR_REF: ${{ github.ref == 'refs/heads/master' && 'master' || 'dev' }}
      DO_DEPLOY: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy) }}
    steps:
      - name: Checkout habits-dev
        uses: actions/checkout@v4
        with:
          path: habits-dev
          # Volle Historie: der Changelog (scripts/vos-changelog) liest bei workflow_dispatch `git log <parent>..HEAD`.
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout Nachbarn (${{ env.NEIGHBOR_REF }})
        run: |
          set -euo pipefail
          for repo in fitness-dev fuel-dev 6pack-dev; do
            git clone --depth 1 --branch "$NEIGHBOR_REF" "https://github.com/nimmsel23/${repo}.git" "$repo"
            echo "$repo @ $(git -C "$repo" rev-parse --short HEAD)"
          done

      # fitness-dev hat das Python-Paket/KB entfernt — SOT ist nimmsel23/fitness.
      - name: Checkout fitness KB (SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness
          ref: main
          path: fitness-kb
          submodules: recursive

      - name: KB in fitness-dev einhängen
        run: |
          set -euo pipefail
          mkdir -p fitness-dev/fitness/catalog
          rm -rf fitness-dev/fitness/catalog/kb
          ln -sfn "$GITHUB_WORKSPACE/fitness-kb" fitness-dev/fitness/catalog/kb
          test -d fitness-dev/fitness/catalog/kb/exercises/6pack
          test -f fitness-dev/fitness/catalog/kb/vendor/free-exercise-db/dist/exercises.json
          echo "KB @ $(git -C fitness-kb rev-parse --short HEAD)"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: habits-dev/pnpm-lock.yaml

      - name: Install (habits-dev, eigener Lockfile)
        working-directory: habits-dev
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Nachbarn (je eigener Lockfile)
        run: |
          set -euo pipefail
          for repo in fitness-dev fuel-dev 6pack-dev; do
            echo "::group::$repo"
            if [ -f "$repo/pnpm-lock.yaml" ]; then
              if grep -q '^overrides:' "$repo/pnpm-lock.yaml" && [ ! -f "$repo/pnpm-workspace.yaml" ]; then
                sed -n '/^overrides:/,/^$/p' "$repo/pnpm-lock.yaml" > "$repo/pnpm-workspace.yaml"
              fi
              (cd "$repo" && pnpm install --frozen-lockfile --ignore-scripts)
            elif [ -f "$repo/package.json" ]; then
              echo "::warning::$repo hat keinen pnpm-lock.yaml — Install ohne Lockfile"
              (cd "$repo" && pnpm install --no-frozen-lockfile --ignore-scripts)
            fi
            echo "::endgroup::"
          done

      - name: Install Submodule habits-dev/journal (eigenes Lockfile)
        working-directory: habits-dev/journal
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fitness-KB-Daten erzeugen (transitive Abhängigkeit über @fitness-db)
        working-directory: fitness-dev
        run: pnpm run build:kb-data

      - name: Build Habits
        working-directory: habits-dev
        run: pnpm run build:firebase

      - name: Deploy Habits to Firebase Hosting
        if: env.DO_DEPLOY == 'true'
        working-directory: habits-dev
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase-tools@latest deploy --only hosting \
            --project fitness-aos --non-interactive
