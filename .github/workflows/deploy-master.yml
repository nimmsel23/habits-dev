# Live-Deploy für Habits: Push auf master
# 
# Baut die App und lädt sie direkt live auf Firebase hoch.
# Analog zur Preview-Action wird das vitalos Meta-Repo ausgecheckt,
# damit alle Nachbar-Repos (cross-repo imports) vorhanden sind.

name: Live Deploy (Habits master)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'journal'
      - '.gitmodules'
      - 'vite.config.cjs'
      - 'tailwind.config.cjs'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vitalos (Meta-Repo, liefert Nachbar-Repos)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/vitalos
          ref: master

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      - name: habits-dev auf den ausgelösten Commit setzen
        run: |
          cd habit-app
          SHA="${{ github.sha }}"
          git fetch origin "$SHA"
          git checkout "$SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (Workspaces)
        run: pnpm install --frozen-lockfile

      - name: Install pinned Journal dependencies
        run: pnpm --dir habit-app/journal install --frozen-lockfile --ignore-scripts

      - name: Firebase config bereitstellen
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "$FIREBASE_CONFIG" > habit-app/firebase.config.js
          elif [ ! -f habit-app/firebase.config.js ]; then
            cp firebase.config.js habit-app/firebase.config.js
          fi
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}

      - name: Build Habits (Live)
        run: pnpm --filter ./habit-app run build:cloud

      - name: Verify complete Journal build and offline cache
        run: node habit-app/scripts/check-journal-build.mjs habit-app/dist-firebase

      - name: Deploy Live
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          entryPoint: habit-app
          channelId: live

      - name: Telegram-Benachrichtigung senden
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Habits ist LIVE deployed (master)!

            🔗 Live-URL: https://fitness-aos.web.app
            (oder eine verknüpfte Domain)

            Commit: ${{ github.event.head_commit.message }}
